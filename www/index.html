<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Particulars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column — plate-style vehicle header, status summary, document cards that expand to edit; "Show officer" mode swaps to a large read-only view. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --sunk:#e3e9e5; --fg:#16201b; --muted:#5b6b62; --line:#cdd8d1;
  --accent:#0b7a43; --accent-ink:#ffffff; --accent-soft:#d6efe1;
  --ok:#11804a; --ok-bg:#dcf2e5; --warn:#a76500; --warn-bg:#fcecc9; --bad:#b3261e; --bad-bg:#f8dcd9; --none:#5b6b62; --none-bg:#e3e9e5;
  --plate-bg:#fbfdfb; --plate-ink:#0a5a32; --plate-red:#c2271d;
  --display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18211c; --sunk:#202b25; --fg:#e6eee9; --muted:#9aaba1; --line:#2d3a33;
  --accent:#3ccf85; --accent-ink:#062014; --accent-soft:#183a28;
  --ok:#5fdc9b; --ok-bg:#163526; --warn:#f2b54a; --warn-bg:#3a2b10; --bad:#ff8a80; --bad-bg:#3d1916; --none:#9aaba1; --none-bg:#232e28;
  --plate-bg:#eef4f0; --plate-ink:#0a5a32; --plate-red:#c2271d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18211c; --sunk:#202b25; --fg:#e6eee9; --muted:#9aaba1; --line:#2d3a33;
  --accent:#3ccf85; --accent-ink:#062014; --accent-soft:#183a28;
  --ok:#5fdc9b; --ok-bg:#163526; --warn:#f2b54a; --warn-bg:#3a2b10; --bad:#ff8a80; --bad-bg:#3d1916; --none:#9aaba1; --none-bg:#232e28;
  --plate-bg:#eef4f0; --plate-ink:#0a5a32; --plate-red:#c2271d; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,label.photo:focus-within{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1{font-size:24px;font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:13px}

.banner{background:var(--warn-bg);color:var(--fg);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.banner b{color:var(--warn)}

/* Plate */
.plate{background:var(--plate-bg);border:3px solid var(--plate-ink);border-radius:10px;padding:6px 14px 8px;display:inline-flex;flex-direction:column;align-items:center;min-width:0;max-width:100%}
.plate .st{font-family:var(--display);font-size:11px;letter-spacing:.14em;color:var(--plate-ink);text-transform:uppercase;font-weight:700}
.plate .no{font-family:var(--mono);font-weight:600;font-size:30px;color:var(--plate-ink);letter-spacing:.06em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.plate .ng{font-family:var(--display);font-size:10px;letter-spacing:.2em;color:var(--plate-red);font-weight:700}

.vehicle{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.vehicle .pic{aspect-ratio:16/9;max-width:100%;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:14px;position:relative}
.vehicle .pic img{width:100%;height:100%;object-fit:cover;display:block}
.vehicle .info{padding:16px;display:flex;flex-direction:column;gap:12px}
.vehicle .meta{font-size:15px;color:var(--muted)}
.vehicle .meta b{color:var(--fg);font-weight:600}

.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.sum .n{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.sum .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sum.ok .n{color:var(--ok)} .sum.warn .n{color:var(--warn)} .sum.bad .n{color:var(--bad)} .sum.none .n{color:var(--none)}

.group{display:flex;flex-direction:column;gap:8px}
.group h2{font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.group h2 small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}

details.doc{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.doc[open]{border-color:var(--accent)}
details.doc summary{list-style:none;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
details.doc summary::-webkit-details-marker{display:none}
.num{font-family:var(--mono);font-size:12px;color:var(--muted);width:40px;height:40px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.num img{width:100%;height:100%;object-fit:cover}
.dt{min-width:0}
.dt .name{font-weight:600;font-size:15px;line-height:1.25}
.dt .sub{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-bg)} .chip.warn{color:var(--warn);background:var(--warn-bg)} .chip.bad{color:var(--bad);background:var(--bad-bg)} .chip.none{color:var(--none);background:var(--none-bg)}

.body{padding:4px 14px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:9px 10px;font:inherit;font-size:15px}
label.photo{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;text-align:center}
label.photo input{position:absolute;width:1px;height:1px;opacity:0}
.thumb{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.thumb img{width:100%;max-height:320px;object-fit:contain;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap}

.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.note b{color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}

/* Show mode */
.show{display:flex;flex-direction:column;gap:14px}
.shead{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.shead .owner{font-size:14px;color:var(--muted)}
.shead .owner b{color:var(--fg);font-size:16px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scard .sh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px}
.scard .sh h3{font-size:17px;font-weight:700}
.scard img{width:100%;display:block;background:var(--sunk);cursor:zoom-in}
.scard .facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:0 14px 12px;font-size:14px}
.scard .facts dt{color:var(--muted)} .scard .facts dd{margin:0;font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.scard .nopic{padding:18px 14px;color:var(--muted);font-size:13.5px;background:var(--sunk)}
.lightbox{position:fixed;inset:0;background:#000;z-index:60;display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));background:#ffffff;color:#000000;border:0;border-radius:999px;padding:8px 14px;font-weight:700}
@media (max-width:380px){.summary{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){details.doc .body{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(-4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div id="lb" class="lightbox" hidden><button id="lbClose" type="button">Close</button><img id="lbImg" alt="Document photo"></div>
<div id="toast" class="toast" hidden></div>

<script>
const KEY = "particulars.v1";
const DOCS = [
  {id:"licence", name:"Driver's Licence", by:"FRSC", group:"core", exp:true},
  {id:"roadworthy", name:"Certificate of Roadworthiness", by:"VIO / State", group:"core", exp:true},
  {id:"vlicence", name:"Vehicle Licence", by:"State Board of Internal Revenue", group:"core", exp:true},
  {id:"ownership", name:"Proof of Ownership", by:"State Licensing Office", group:"core", exp:true},
  {id:"insurance", name:"Certificate of Insurance", by:"Insurer (NIID verified)", group:"core", exp:true},
  {id:"cmr", name:"Central Motor Registry (CMR)", by:"Nigeria Police", group:"core", exp:true},
  {id:"tint", name:"Tinted Glass Permit", by:"Nigeria Police", group:"extra", exp:true},
  {id:"hackney", name:"Hackney Permit", by:"State (commercial use only)", group:"extra", exp:true},
  {id:"purchase", name:"Purchase Receipt", by:"Seller / Dealer", group:"extra", exp:false},
  {id:"customs", name:"Customs Duty Papers", by:"Nigeria Customs (imported cars)", group:"extra", exp:false},
  {id:"affidavit", name:"Affidavit", by:"Court (if papers lost or name changed)", group:"extra", exp:false},
  {id:"police", name:"Police Report", by:"Nigeria Police (if any incident)", group:"extra", exp:false},
];

function iso(offsetDays){const d=new Date();d.setDate(d.getDate()+offsetDays);return d.toISOString().slice(0,10);}
function exampleState(){
  return {example:true, vehicle:{plate:"KJA 482 XY", state:"Lagos", make:"Lexus", model:"RX 350", year:"2012", colour:"Pearl White", owner:"Tunde Bakare (example)", phone:"0803 000 0000", photo:""},
    docs:{
      licence:{number:"LAG12345AA67", issued:iso(-700), expires:iso(395), photo:""},
      roadworthy:{number:"RW-0098821", issued:iso(-345), expires:iso(20), photo:""},
      vlicence:{number:"VL-5561203", issued:iso(-345), expires:iso(20), photo:""},
      ownership:{number:"POC-778120", issued:iso(-200), expires:iso(165), photo:""},
      insurance:{number:"NIID-TP-339201", issued:iso(-380), expires:iso(-15), photo:""},
      cmr:{number:"CMR-2241907", issued:iso(-100), expires:iso(265), photo:""},
      tint:{number:"", issued:"", expires:"", photo:""},
    }};
}
function blankState(){return {example:false, vehicle:{plate:"",state:"",make:"",model:"",year:"",colour:"",owner:"",phone:"",photo:""}, docs:{}};}

let S; let mode="edit"; let saveOK=true;
const CAP=window.Capacitor; const NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
const PL=(CAP&&CAP.Plugins)||{};
const PHOTO_IDS=()=>["__car",...DOCS.map(d=>d.id)];
function getPhoto(id){return id==="__car"?S.vehicle.photo:(S.docs[id]||{}).photo;}
function setPhoto(id,v){if(id==="__car")S.vehicle.photo=v;else doc(id).photo=v;}
function slim(){const c=JSON.parse(JSON.stringify(S));c.vehicle.photo=c.vehicle.photo?"file":"";Object.values(c.docs).forEach(d=>{if(d.photo)d.photo="file";});return c;}
async function load(){
  try{
    if(NATIVE){
      const r=await PL.Preferences.get({key:KEY});
      if(r&&r.value){S=JSON.parse(r.value);
        for(const id of PHOTO_IDS()){if(getPhoto(id)==="file"){try{const f=await PL.Filesystem.readFile({path:"photos/"+id+".jpg",directory:"DATA"});setPhoto(id,"data:image/jpeg;base64,"+f.data);}catch(e){setPhoto(id,"");}}}
        return;}
    }else{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);return;}}
  }catch(e){}
  S=exampleState();
}
let saveTimer; const written={};
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,250);}
async function saveNow(){
  try{
    if(NATIVE){
      for(const id of PHOTO_IDS()){const v=getPhoto(id)||"";if(written[id]===v)continue;
        if(v.startsWith("data:")){await PL.Filesystem.writeFile({path:"photos/"+id+".jpg",data:v.split(",")[1],directory:"DATA",recursive:true});}
        else{try{await PL.Filesystem.deleteFile({path:"photos/"+id+".jpg",directory:"DATA"});}catch(e){}}
        written[id]=v;}
      await PL.Preferences.set({key:KEY,value:JSON.stringify(slim())});
      scheduleReminders();
    }else{localStorage.setItem(KEY,JSON.stringify(S));}
    saveOK=true;
  }catch(e){saveOK=false;toast("Couldn't save. Your phone may be out of storage.");}
}

/* Expiry reminders: 30 days, 7 days and on the day, at 9am */
let askedNotif=false;
async function scheduleReminders(){
  const LN=PL.LocalNotifications; if(!LN||S.example)return;
  try{
    const list=[]; const now=Date.now();
    DOCS.forEach((def,i)=>{const d=S.docs[def.id];if(!def.exp||!d||!d.expires)return;
      [[30,"expires in 30 days"],[7,"expires in 7 days"],[0,"expires today"]].forEach(([before,txt],j)=>{
        const at=new Date(d.expires+"T09:00:00");at.setDate(at.getDate()-before);
        if(at.getTime()>now)list.push({id:1000+i*10+j,title:def.name+" "+txt,body:(S.vehicle.plate?S.vehicle.plate+": ":"")+"renew it before your next trip.",schedule:{at,allowWhileIdle:true}});});});
    const pend=await LN.getPending(); if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    if(!list.length)return;
    let perm=await LN.checkPermissions();
    if(perm.display!=="granted"&&!askedNotif){askedNotif=true;perm=await LN.requestPermissions();}
    if(perm.display==="granted")await LN.schedule({notifications:list});
  }catch(e){}
}
async function nativePhoto(id){
  try{
    const p=await PL.Camera.getPhoto({source:"PROMPT",resultType:"base64",quality:72,width:1400,correctOrientation:true,promptLabelHeader:"Add photo",promptLabelPhoto:"Choose from gallery",promptLabelPicture:"Take photo"});
    if(!p||!p.base64String)return;
    if(S.example){S=blankState();toast("Example cleared. This is now your own car");}
    setPhoto(id,"data:image/jpeg;base64,"+p.base64String);save();render();toast("Photo saved");
  }catch(e){if(!/cancel/i.test(String(e&&e.message)))toast("Couldn't get that photo. Check camera permission in Settings.");}
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2800);}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function doc(id){return S.docs[id]||(S.docs[id]={number:"",issued:"",expires:"",photo:""});}
function fmt(d){if(!d)return "";const x=new Date(d+"T00:00:00");return x.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});}
function status(def,d){
  const has=d&&(d.number||d.photo||d.expires);
  if(!has) return {k:"none",t:"Missing",sub:"Not added yet"};
  if(def.exp&&d.expires){
    const days=Math.round((new Date(d.expires+"T00:00:00")-new Date(new Date().toDateString()))/864e5);
    if(days<0) return {k:"bad",t:"Expired",sub:"Expired "+fmt(d.expires)};
    if(days<=30) return {k:"warn",t:days===0?"Ends today":days+" days left",sub:"Expires "+fmt(d.expires)};
    return {k:"ok",t:"Valid",sub:"Valid until "+fmt(d.expires)};
  }
  return {k:"ok",t:"On file",sub:d.number?("No. "+d.number):"Photo saved"};
}

function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const max=1400;let w=im.width,h=im.height;if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",0.72));};im.src=fr.result;};fr.readAsDataURL(file);});}

function plateHTML(v){return `<div class="plate"><span class="st">${esc(v.state||"State")}</span><span class="no">${esc(v.plate||"ABC 123 XY")}</span><span class="ng">Federal Republic of Nigeria</span></div>`;}

function renderEdit(){
  const v=S.vehicle; const counts={ok:0,warn:0,bad:0,none:0};
  DOCS.filter(d=>d.group==="core").forEach(d=>counts[status(d,S.docs[d.id]).k]++);
  const docCard=def=>{const d=S.docs[def.id]||{};const st=status(def,d);return `
  <details class="doc" data-id="${def.id}">
    <summary><span class="num">${d.photo?`<img src="${d.photo}" alt="">`:"—"}</span>
      <span class="dt"><span class="name">${esc(def.name)}</span><br><span class="sub">${esc(st.sub)}</span></span>
      <span class="chip ${st.k}">${esc(st.t)}</span></summary>
    <div class="body">
      <p class="hint">Issued by ${esc(def.by)}</p>
      <div class="fields">
        <div class="f full"><label for="n-${def.id}">Document number</label><input id="n-${def.id}" data-doc="${def.id}" data-k="number" value="${esc(d.number)}" autocomplete="off"></div>
        <div class="f ${def.exp?"":"full"}"><label for="i-${def.id}">Issue date</label><input type="date" id="i-${def.id}" data-doc="${def.id}" data-k="issued" value="${esc(d.issued)}"></div>
        ${def.exp?`<div class="f"><label for="e-${def.id}">Expiry date</label><input type="date" id="e-${def.id}" data-doc="${def.id}" data-k="expires" value="${esc(d.expires)}"></div>`:""}
      </div>
      ${d.photo?`<div class="thumb"><img src="${d.photo}" alt="${esc(def.name)} photo"></div>
        <div class="row"><label class="photo btn small" style="border-style:solid">Replace photo<input type="file" accept="image/*" data-photo="${def.id}"></label><button type="button" class="btn small ghost" data-rmphoto="${def.id}">Remove photo</button></div>`
      :`<label class="photo">＋ Add photo or scan<input type="file" accept="image/*" data-photo="${def.id}"></label>`}
      <div class="row"><button type="button" class="btn small ghost" data-clear="${def.id}">Clear this document</button></div>
    </div>
  </details>`;};
  return `
  <div class="top"><div><div class="eyebrow">Vehicle particulars</div><h1>Particulars</h1></div>
    <button type="button" class="btn primary" id="toShow">Show officer</button></div>
  ${S.example?`<div class="banner"><span><b>Example car.</b> These details are made up so you can see how it works.</span><button type="button" class="btn small" id="start">Start my own</button></div>`:""}
  <section class="vehicle">
    <div class="pic">${v.photo?`<img src="${v.photo}" alt="Car photo">`:`<label class="photo" style="border:0">＋ Add a photo of your car<input type="file" accept="image/*" data-photo="__car"></label>`}</div>
    <div class="info">
      <div>${plateHTML(v)}</div>
      <div class="fields">
        <div class="f"><label for="v-plate">Plate number</label><input id="v-plate" data-v="plate" value="${esc(v.plate)}" autocomplete="off"></div>
        <div class="f"><label for="v-state">State on plate</label><input id="v-state" data-v="state" value="${esc(v.state)}"></div>
        <div class="f"><label for="v-make">Make</label><input id="v-make" data-v="make" value="${esc(v.make)}"></div>
        <div class="f"><label for="v-model">Model</label><input id="v-model" data-v="model" value="${esc(v.model)}"></div>
        <div class="f"><label for="v-year">Year</label><input id="v-year" data-v="year" inputmode="numeric" value="${esc(v.year)}"></div>
        <div class="f"><label for="v-colour">Colour</label><input id="v-colour" data-v="colour" value="${esc(v.colour)}"></div>
        <div class="f"><label for="v-owner">Owner's name</label><input id="v-owner" data-v="owner" value="${esc(v.owner)}"></div>
        <div class="f"><label for="v-phone">Phone</label><input id="v-phone" data-v="phone" inputmode="tel" value="${esc(v.phone)}"></div>
      </div>
      ${v.photo?`<div class="row"><label class="photo btn small" style="border-style:solid">Change car photo<input type="file" accept="image/*" data-photo="__car"></label></div>`:""}
    </div>
  </section>
  <div class="summary">
    <div class="sum ok"><div class="n">${counts.ok}</div><div class="l">Valid</div></div>
    <div class="sum warn"><div class="n">${counts.warn}</div><div class="l">Due soon</div></div>
    <div class="sum bad"><div class="n">${counts.bad}</div><div class="l">Expired</div></div>
    <div class="sum none"><div class="n">${counts.none}</div><div class="l">Missing</div></div>
  </div>
  <section class="group"><h2>Main documents <small>Asked for at most checkpoints</small></h2>${DOCS.filter(d=>d.group==="core").map(docCard).join("")}</section>
  <section class="group"><h2>Extra documents <small>Only if they apply to you</small></h2>${DOCS.filter(d=>d.group==="extra").map(docCard).join("")}</section>
  <div class="note">
    <b>Where your papers are kept</b>
    <span>Everything you add stays on this phone. Nothing is uploaded and there is no account. Uninstalling the app or clearing its data deletes your papers, so keep the originals safe.</span>
    <b>Expiry reminders</b>
    <span>Particulars reminds you 30 days and 7 days before a document expires, and on the day.</span>
    <b>Carry the originals too</b>
    <span>Officers can still ask for original documents. Use this as a tidy backup and a quick way to show what you have.</span>
    <span style="font-size:12px">Particulars is an independent app. It is not affiliated with or endorsed by FRSC, the Nigeria Police, VIO or any government agency.</span>
  </div>
  <div class="row"><button type="button" class="btn small ghost" id="reset">Delete everything on this phone</button><span id="confirmWrap" hidden><button type="button" class="btn small" id="confirmReset" style="color:var(--bad)">Yes, delete all</button></span></div>`;
}

function renderShow(){
  const v=S.vehicle;
  const shown=DOCS.filter(def=>{const d=S.docs[def.id];return d&&(d.number||d.photo||d.expires);});
  return `
  <div class="top"><div><div class="eyebrow">Vehicle particulars</div><h1>${esc([v.make,v.model].filter(Boolean).join(" ")||"My car")}</h1></div>
    <button type="button" class="btn" id="toEdit">Done</button></div>
  <div class="shead">
    ${plateHTML(v)}
    ${v.photo?`<img src="${v.photo}" alt="Car photo" data-zoom style="width:100%;border-radius:10px;cursor:zoom-in">`:""}
    <div class="owner"><b>${esc(v.owner||"Owner")}</b><br>${esc([v.year,v.colour].filter(Boolean).join(" · "))}${v.phone?" · "+esc(v.phone):""}</div>
  </div>
  <div class="show">${shown.length?shown.map(def=>{const d=S.docs[def.id];const st=status(def,d);return `
    <article class="scard">
      <div class="sh"><h3>${esc(def.name)}</h3><span class="chip ${st.k}">${esc(st.t)}</span></div>
      ${d.photo?`<img src="${d.photo}" alt="${esc(def.name)}" data-zoom>`:`<div class="nopic">No photo added</div>`}
      <dl class="facts" style="padding-top:12px">
        ${d.number?`<dt>Number</dt><dd>${esc(d.number)}</dd>`:""}
        ${d.issued?`<dt>Issued</dt><dd>${fmt(d.issued)}</dd>`:""}
        ${def.exp&&d.expires?`<dt>Expires</dt><dd>${fmt(d.expires)}</dd>`:""}
        <dt>Issuer</dt><dd style="font-family:var(--body)">${esc(def.by)}</dd>
      </dl>
    </article>`;}).join(""):`<div class="note">No documents added yet. Tap Done and add your papers first.</div>`}</div>`;
}

let openIds=new Set();
function render(){
  const app=document.getElementById("app");
  document.querySelectorAll("details.doc[open]").forEach(d=>openIds.add(d.dataset.id));
  app.innerHTML=mode==="edit"?renderEdit():renderShow();
  if(mode==="edit") document.querySelectorAll("details.doc").forEach(d=>{if(openIds.has(d.dataset.id))d.open=true;d.addEventListener("toggle",()=>{d.open?openIds.add(d.dataset.id):openIds.delete(d.dataset.id);});});
}

document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.photo){const f=t.files&&t.files[0];if(!f)return;
    try{const url=await compress(f);if(S.example){S=blankState();toast("Example cleared — this is now your own car");} if(t.dataset.photo==="__car")S.vehicle.photo=url;else doc(t.dataset.photo).photo=url;save();render();if(saveOK)toast("Photo saved");}
    catch(err){toast("That file couldn't be read. Try a JPG or PNG photo.");}
    return;}
  if(t.dataset.doc){doc(t.dataset.doc)[t.dataset.k]=t.value;save();render();}
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.v){S.vehicle[t.dataset.v]=t.value;const p=document.querySelector(".info .plate");if(p&&(t.dataset.v==="plate"||t.dataset.v==="state"))p.outerHTML=plateHTML(S.vehicle);save();}});
document.addEventListener("focusin",e=>{if(S.example&&e.target.matches("input:not([type=file])")){S=blankState();save();render();toast("Example cleared — this is now your own car");const id=e.target.id;const el=id&&document.getElementById(id);if(el){const det=el.closest("details");if(det)det.open=true;el.focus();}}});
document.addEventListener("click",e=>{
  if(NATIVE){const lab=e.target.closest("label.photo");if(lab){const inp=lab.querySelector("input[type=file]");if(inp){e.preventDefault();nativePhoto(inp.dataset.photo);return;}}}
  const t=e.target.closest("button,[data-zoom]");if(!t)return;
  if(t.id==="toShow"){mode="show";render();scrollTo(0,0);}
  else if(t.id==="toEdit"){mode="edit";render();scrollTo(0,0);}
  else if(t.id==="start"){S=blankState();save();render();toast("Ready — add your own car");}
  else if(t.dataset.clear){delete S.docs[t.dataset.clear];save();render();}
  else if(t.dataset.rmphoto){doc(t.dataset.rmphoto).photo="";save();render();}
  else if(t.id==="reset"){document.getElementById("confirmWrap").hidden=false;}
  else if(t.id==="confirmReset"){try{localStorage.removeItem(KEY);}catch(_){}S=blankState();PHOTO_IDS().forEach(id=>written[id]=undefined);save();render();toast("Deleted from this phone");}
  else if(t.dataset.zoom!==undefined){document.getElementById("lbImg").src=t.src;document.getElementById("lb").hidden=false;}
  else if(t.id==="lbClose"){document.getElementById("lb").hidden=true;}
});
document.getElementById("lb").addEventListener("click",e=>{if(e.target.id==="lb")e.currentTarget.hidden=true;});
load().then(render);
</script>
</body>
</html>
